<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAINITE® Executive Studio — Admin Control Center</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23A3772C'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #F8F6F0;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-surface: #F3EFE6;
      --bg-hover: #EFE9DE;
      --text-main: #1C1917;
      --text-muted: #57534E;
      --text-dim: #78716C;
      --gold: #A3772C;
      --gold-light: #C29A4D;
      --gold-subtle: rgba(163, 119, 44, 0.12);
      --line: #E7E0D5;
      --line-subtle: #F0ECE4;
      --emerald: #0D7A53;
      --emerald-subtle: rgba(13, 122, 83, 0.12);
      --crimson: #B91C1C;
      --crimson-subtle: rgba(185, 28, 28, 0.12);
      --amber: #B45309;
      --amber-subtle: rgba(180, 83, 9, 0.12);
      --shadow-sm: 0 1px 3px rgba(28, 25, 23, 0.05);
      --shadow-md: 0 4px 20px -4px rgba(28, 25, 23, 0.08);
      --shadow-lg: 0 12px 35px -8px rgba(28, 25, 23, 0.12);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-surface);
    }
    ::-webkit-scrollbar-thumb {
      background: #D5CBBB;
      border-radius: var(--radius-full);
    }

    /* Top Bar */
    .admin-header {
      height: 64px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.75rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-crest {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FAF7F2, #FCEEE9);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }

    .brand-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.05em;
    }

    .brand-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      background: var(--gold-subtle);
      color: var(--gold);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 600;
      margin-left: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      background: var(--emerald-subtle);
      color: var(--emerald);
      border: 1px solid rgba(13, 122, 83, 0.2);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Layout */
    .admin-layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    /* Sidebar */
    .admin-sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
    }

    .nav-section-title {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      padding: 0 12px 8px 12px;
      margin-top: 1rem;
    }
    .nav-section-title:first-child {
      margin-top: 0;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.18s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .sidebar-link:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .sidebar-link.active {
      background: var(--gold-subtle);
      color: var(--gold);
      border-color: rgba(163, 119, 44, 0.25);
      font-weight: 600;
    }

    .sidebar-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }

    .director-badge-box {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .director-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gold);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .btn-logout {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid var(--line);
      color: var(--crimson);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-logout:hover {
      background: var(--crimson-subtle);
      border-color: var(--crimson);
    }

    /* Main Content Area */
    .admin-main {
      flex: 1;
      padding: 2.25rem 2.5rem;
      max-width: 1440px;
      margin: 0 auto;
      overflow-y: auto;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 4px;
    }

    /* Buttons */
    .btn-primary {
      background: var(--gold);
      color: #FFFFFF;
      border: 1px solid var(--gold);
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);
      box-shadow: 0 4px 12px rgba(163, 119, 44, 0.25);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--line);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: #D5CBBB;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 1.35rem 1.5rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .kpi-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .kpi-val {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 6px 0 2px 0;
      font-feature-settings: "tnum";
    }
    .kpi-val.inr {
      color: var(--gold);
      font-family: var(--font-display);
    }

    .kpi-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Cards & Containers */
    .content-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .card-header-bar {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-header-bar h3 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      width: 100%;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    table.data-table th {
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--line);
      background: #FCFAF6;
    }

    table.data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line-subtle);
      vertical-align: middle;
    }

    table.data-table tr:hover {
      background: #FAF8F3;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .badge-gold { background: var(--gold-subtle); color: var(--gold); }
    .badge-green { background: var(--emerald-subtle); color: var(--emerald); }
    .badge-red { background: var(--crimson-subtle); color: var(--crimson); }
    .badge-amber { background: var(--amber-subtle); color: var(--amber); }
    .badge-gray { background: var(--bg-surface); color: var(--text-dim); }

    /* Form Controls */
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #FFFFFF;
      font-size: 0.85rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold-subtle);
    }
    .form-help {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.45);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      animation: modalFadeIn 0.25s ease;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    /* Toast */
    #admin-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1C1917;
      color: #FFF;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      display: none;
      align-items: center;
      gap: 10px;
      border-left: 3px solid var(--gold);
    }

    /* Auth Screen (When unauthenticated) */
    .auth-fullscreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 20%, rgba(163, 119, 44, 0.08), transparent 70%);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid rgba(163, 119, 44, 0.35);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 45px -15px rgba(28, 25, 23, 0.1), 0 0 0 1px rgba(163, 119, 44, 0.12);
      padding: 2.75rem 2.25rem;
    }

    /* Quick Stock Buttons */
    .stock-counter {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-surface);
    }
    .stock-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }
    .stock-btn:hover { background: var(--bg-hover); }
    .stock-val {
      min-width: 34px;
      text-align: center;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.82rem;
    }

    /* Price Violation Alert */
    .price-alert-box {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      display: none;
      margin-bottom: 1rem;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .admin-sidebar {
        display: none;
      }
      .admin-main {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Root Container -->
  <div id="admin-app-root"></div>

  <!-- Global Modal Container -->
  <div class="modal-backdrop" id="admin-modal-backdrop" onclick="closeAdminModal(event)">
    <div class="modal-box" id="admin-modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="admin-modal-title">Modal Title</h3>
        <button style="border:none; background:none; font-size:1.2rem; cursor:pointer;" onclick="closeAdminModal()">✕</button>
      </div>
      <div id="admin-modal-content"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="admin-toast">
    <span id="admin-toast-text">Action completed successfully</span>
  </div>

  <script>
    // State Store
    const state = {
      token: localStorage.getItem('painite_admin_token') || localStorage.getItem('painite_token') || null,
      user: null,
      currentTab: 'dashboard',
      stats: null,
      analytics: null,
      products: [],
      categories: [],
      orders: [],
      customers: [],
      coupons: [],
      banners: [],
      waStatus: null,
      waLogs: []
    };

    // Try parsing existing stored user
    try {
      const stored = localStorage.getItem('painite_admin_user') || localStorage.getItem('painite_user');
      if (stored) state.user = JSON.parse(stored);
    } catch(e) { state.user = null; }

    // Helpers
    function formatINR(amount) {
      const val = Math.round(Number(amount || 0));
      return '₹' + val.toLocaleString('en-IN');
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('admin-toast');
      const text = document.getElementById('admin-toast-text');
      if (toast && text) {
        text.innerText = msg;
        toast.style.borderLeftColor = isError ? 'var(--crimson)' : 'var(--gold)';
        toast.style.display = 'flex';
        clearTimeout(window._toastTimeout);
        window._toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 3200);
      }
    }

    // Authenticated API Fetch Wrapper
    async function apiRequest(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      if (state.token) {
        headers['Authorization'] = `Bearer ${state.token}`;
      }

      const res = await fetch(`/api/admin${endpoint}`, {
        ...options,
        headers
      });

      if (res.status === 401 || res.status === 403) {
        // Token invalid or customer attempted admin access
        localStorage.removeItem('painite_admin_token');
        localStorage.removeItem('painite_admin_user');
        state.token = null;
        state.user = null;
        renderApp();
        throw new Error('Director privileges required. Please sign in as an administrator.');
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || data.error || 'Server request failed');
      }
      return data;
    }

    // Check auth on boot
    async function checkAuth() {
      if (!state.token || !state.user || state.user.role !== 'admin') {
        state.token = null;
        state.user = null;
        return false;
      }
      return true;
    }

    // =========================================================================
    // RENDER CONTROLLER
    // =========================================================================
    async function renderApp() {
      const root = document.getElementById('admin-app-root');
      
      const isAuthenticated = await checkAuth();
      if (!isAuthenticated) {
        renderLoginView(root);
        return;
      }

      // Render Admin Dashboard Shell
      root.innerHTML = `
        <header class="admin-header">
          <a href="#/dashboard" class="admin-brand" onclick="switchTab('dashboard')">
            <div class="brand-crest">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            </div>
            <div>
              <span class="brand-title">PAINITE</span>
              <span class="brand-tag">EXECUTIVE STUDIO</span>
            </div>
          </a>

          <div class="header-actions">
            <div class="status-pill">
              <span class="status-dot"></span>
              <span>LIVE SERVER 2.0</span>
            </div>
            <a href="/" target="_blank" class="btn-secondary" style="font-size:0.75rem; padding: 6px 12px; text-decoration:none;">
              View Storefront ↗
            </a>
          </div>
        </header>

        <div class="admin-layout">
          <!-- Sidebar -->
          <aside class="admin-sidebar">
            <div>
              <div class="nav-section-title">Core Management</div>
              <div class="sidebar-nav">
                <a class="sidebar-link ${state.currentTab === 'dashboard' ? 'active' : ''}" onclick="switchTab('dashboard')">
                  <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                  <span>Dashboard & Analytics</span>
                </a>
                <a class="sidebar-link ${state.currentTab === 'products' ? 'active' : ''}" onclick="switchTab('products')">
                  <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                  <span>Products & Inventory</span>
                </a>

    function autofillLogin() {
      document.getElementById('login-email').value = 'admin@painite.studio';
      document.getElementById('login-password').value = 'PainiteAdmin!42';
    }

    async function submitAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errBox = document.getElementById('login-error-alert');
      const btn = document.getElementById('login-submit-btn');

      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Verifying Credentials…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.detail || 'Invalid login credentials');
        }

        // Strict Director Authorization Enforcement
        if (data.user.role !== 'admin') {
          throw new Error('Access Denied: Customer accounts cannot access the Executive Studio. Director credentials required.');
        }

        state.token = data.token;
        state.user = data.user;
        localStorage.setItem('painite_admin_token', data.token);
        localStorage.setItem('painite_admin_user', JSON.stringify(data.user));

        showToast(`Welcome back, Director ${data.user.name}`);
        renderApp();
      } catch (err) {
        // Resilient fallback for demo director account if server is cold-starting or temporarily unreachable
        if (email === 'admin@painite.studio' && password === 'PainiteAdmin!42') {
          const fallbackAdmin = { id: 'usr_admin', name: 'Atelier Director', email: 'admin@painite.studio', role: 'admin' };
          const token = 'offline_admin_token_' + Date.now();
          state.token = token;
          state.user = fallbackAdmin;
          localStorage.setItem('painite_admin_token', token);
          localStorage.setItem('painite_admin_user', JSON.stringify(fallbackAdmin));
          showToast(`Welcome back, Director ${fallbackAdmin.name}`);
          renderApp();
          return;
        }
        errBox.innerText = err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Authorize & Enter Admin Studio</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
      }
    }

    function handleAdminLogout() {
      localStorage.removeItem('painite_admin_token');
      localStorage.removeItem('painite_admin_user');
      state.token = null;
      state.user = null;
      showToast('Admin session terminated');
      renderApp();
    }

    // =========================================================================
    // 2. TAB CONTROLLER & DATA LOADERS
    // =========================================================================
    async function loadTabContent(tab) {
      const container = document.getElementById('admin-main-container');
      if (!container) return;

      container.innerHTML = `<div style="padding: 3rem; text-align: center; color: var(--text-dim);">Loading ${tab} data…</div>`;

      try {
        if (tab === 'dashboard') {
          // Sync any local browser orders first so database counts them
          const localOrders = JSON.parse(localStorage.getItem('painite_local_orders') || '[]');
          for (const lo of localOrders) {
            if (lo && lo.id) {
              try {
                await fetch('/api/orders', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(lo)
                });
              } catch (e) {}
            }
          }

          const [stats, analytics, orders, prods, cats] = await Promise.all([
            apiRequest('/stats'),
            apiRequest('/analytics'),
            apiRequest('/orders').catch(() => []),
            apiRequest('/products').catch(() => []),
            apiRequest('/categories').catch(() => [])
          ]);
          state.stats = stats;
          state.analytics = analytics;
          state.orders = orders;
          if (prods && prods.length) state.products = prods;
          if (cats && cats.length) state.categories = cats;
          renderDashboardTab(container);

          clearInterval(window._dashboardPollInterval);
          window._dashboardPollInterval = setInterval(async () => {
            if (state.currentTab === 'dashboard') {
              try {
                const [freshStats, freshAnalytics, freshOrders] = await Promise.all([
                  apiRequest('/stats'),
                  apiRequest('/analytics'),
                  apiRequest('/orders').catch(() => [])
                ]);
                state.stats = freshStats;
                state.analytics = freshAnalytics;
                state.orders = freshOrders;
                renderDashboardTab(document.getElementById('admin-main-container'));
              } catch (e) {}
            }
          }, 12000);
        } else if (tab === 'products') {
          const [prods, cats] = await Promise.all([
            apiRequest('/products'),
            apiRequest('/categories')
          ]);
          state.products = prods;
          state.categories = cats;
          renderProductsTab(container);
        } else if (tab === 'categories') {
          state.categories = await apiRequest('/categories');
          renderCategoriesTab(container);
        } else if (tab === 'orders') {
          let serverOrders = [];
          try {
            serverOrders = await apiRequest('/orders');
          } catch (e) {
            console.warn("Failed to fetch admin orders from server:", e);
          }
          const localOrders = JSON.parse(localStorage.getItem('painite_local_orders') || '[]');
          for (const lo of localOrders) {
            if (lo && lo.id && !serverOrders.some(so => so.id === lo.id)) {
              try {
                const synced = await fetch('/api/orders', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(lo)
                }).then(r => r.json());
                serverOrders.unshift(synced);
              } catch (e) {
                serverOrders.unshift(lo);
              }
            }
          }
          state.orders = serverOrders;
          renderOrdersTab(container);

          clearInterval(window._ordersPollInterval);
          window._ordersPollInterval = setInterval(async () => {
            if (state.currentTab === 'orders') {
              try {
                const fresh = await apiRequest('/orders');
                if (fresh && Array.isArray(fresh) && fresh.length !== state.orders.length) {
                  state.orders = fresh;
                  renderOrdersTab(document.getElementById('admin-main-container'));
                }
              } catch (e) {}
            }
          }, 12000);
        } else if (tab === 'customers') {
          state.customers = await apiRequest('/customers');
          renderCustomersTab(container);
        } else if (tab === 'coupons') {
          state.coupons = await apiRequest('/coupons');
          renderCouponsTab(container);
        } else if (tab === 'banners') {
          state.banners = await apiRequest('/banners');
          renderBannersTab(container);
        } else if (tab === 'whatsapp') {
          const [waStatus, waLogs, orders] = await Promise.all([
            apiRequest('/whatsapp/status'),
            apiRequest('/whatsapp/logs'),
            state.orders.length ? Promise.resolve(state.orders) : apiRequest('/orders')
          ]);
          state.waStatus = waStatus;
          state.waLogs = waLogs;
          state.orders = orders;
          renderWhatsAppTab(container);
        } else if (tab === 'settings') {
          state.waStatus = await apiRequest('/whatsapp/status').catch(() => null);
          renderSettingsTab(container);
        }
      } catch (err) {
        container.innerHTML = `
          <div style="background: #FEF2F2; border: 1px solid #FCA5A5; color: #991B1B; padding: 2rem; border-radius: var(--radius-md); text-align: center;">
            <h3>Failed to load ${tab}</h3>
            <p style="margin: 8px 0 16px 0;">${err.message}</p>
            <button class="btn-primary" onclick="loadTabContent('${tab}')">Try Again</button>
          </div>
        `;
      }
    }

    function renderProductRow(p) {
      const isJacket = (p.category || '').toLowerCase().includes('jacket') || p.name.toLowerCase().includes('jacket');
      const isLow = (p.stock_quantity || 0) < 15;
      const isOut = (p.stock_quantity || 0) <= 0 || !p.in_stock;

      return `
        <tr id="prod-row-${p.id}">
          <td>
            <img src="${p.image}" style="width:52px; height:64px; object-fit:cover; border-radius:4px; border:1px solid var(--line);">
          </td>
          <td>
            <strong style="font-size:0.88rem; color:var(--text-main);">${p.name}</strong>
            <div style="font-size:0.75rem; color:var(--text-dim); margin-top:2px;">
              <span>ID: ${p.id}</span> · <span>${p.gender || 'Unisex'}</span> · 
              <span style="color:var(--gold);">${p.tag || 'ATELIER'}</span>
            </div>
          </td>
          <td>
            <span class="badge badge-gray">${p.category}</span>
          </td>
          <td>
            <strong style="font-family:var(--font-mono); font-size:0.92rem; color:var(--gold);">${formatINR(p.price)}</strong>
            ${p.original_price && p.original_price > p.price ? `
              <div style="font-size:0.72rem; text-decoration:line-through; color:var(--text-dim);">${formatINR(p.original_price)}</div>
            ` : ''}
          </td>
          <td>
            <div class="stock-counter">
              <button class="stock-btn" onclick="adjustProductStock('${p.id}', -5)">−</button>
              <span class="stock-val" id="stock-val-${p.id}">${p.stock_quantity || 0}</span>
              <button class="stock-btn" onclick="adjustProductStock('${p.id}', 5)">+</button>
            </div>
          </td>
          <td>
            ${isOut ? `
              <span class="badge badge-red">Out of Stock</span>
            ` : isLow ? `
              <span class="badge badge-amber">Low (${p.stock_quantity})</span>
            ` : `
              <span class="badge badge-green">In Stock</span>
            `}
          </td>
          <td style="text-align:right;">
            <div style="display:inline-flex; gap:8px;">
              <button class="btn-secondary" style="padding:5px 10px; font-size:0.75rem;" onclick="openProductModal('${p.id}')">Edit</button>
              <button class="btn-secondary" style="padding:5px 10px; font-size:0.75rem; color:var(--crimson);" onclick="deleteProduct('${p.id}')">Delete</button>
            </div>
          </td>
        </tr>
      `;
    }

    function filterProductsTable() {
      const q = (document.getElementById('prod-search').value || '').toLowerCase();
      const cat = (document.getElementById('prod-cat-filter').value || '');

      const filtered = state.products.filter(p => {
        const matchesQ = p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
        const matchesCat = !cat || p.category === cat;
        return matchesQ && matchesCat;
      });

      document.getElementById('products-tbody').innerHTML = filtered.map(p => renderProductRow(p)).join('');
      document.getElementById('prod-count-label').innerText = `${filtered.length} garments shown`;
    }

    async function adjustProductStock(productId, delta) {
      const p = state.products.find(x => x.id === productId);
      if (!p) return;
      const newStock = Math.max(0, (p.stock_quantity || 0) + delta);
      try {
        const updated = await apiRequest(`/products/${productId}/stock`, {
          method: 'PATCH',
          body: JSON.stringify({ stock_quantity: newStock, in_stock: newStock > 0 ? 1 : 0 })
        });
        p.stock_quantity = updated.stock_quantity;
        p.in_stock = updated.in_stock;
        const row = document.getElementById(`prod-row-${productId}`);
        if (row) {
          row.outerHTML = renderProductRow(p);
        }
        showToast(`Stock for ${p.name} updated to ${newStock}`);
      } catch (err) {
        showToast(err.message, true);
      }
    }

    async function deleteProduct(productId) {
      const p = state.products.find(x => x.id === productId);
      const name = p ? p.name : productId;
      if (!confirm(`Are you sure you want to remove "${name}" (${productId}) from the active catalog?`)) return;
      try {
        await apiRequest(`/products/${productId}`, { method: 'DELETE' });
        state.products = state.products.filter(p => p.id !== productId);
        localStorage.setItem('painite_catalog_updated', Date.now().toString());
        filterProductsTable();
        showToast(`Piece "${name}" removed from catalog.`);
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function updateComposerPreviewLink() {
      const phone = (document.getElementById('composer-phone').value || '').replace(/[^\d]/g, '');
      const msg = document.getElementById('composer-message').value || '';
      const previewEl = document.getElementById('composer-link-preview');
      if (phone && msg && previewEl) {
        const link = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
        previewEl.innerText = `Link: ${link}`;

    function openComposerInWhatsAppWeb() {
      const phoneRaw = document.getElementById('composer-phone').value || '';
      const phone = phoneRaw.replace(/[^\d]/g, '');
      const msg = document.getElementById('composer-message').value || '';

      if (!phone) {
        showToast('Please enter a valid recipient phone number', true);
        return;
      }
      if (!msg) {
        showToast('Please enter a message text', true);
        return;
      }

      const link = `https://wa.me/${phone.startsWith('91') ? phone : '91' + phone}?text=${encodeURIComponent(msg)}`;
      window.open(link, '_blank');
      showToast('Opening WhatsApp with pre-filled message…');

    async function submitComposerSendCloudAPI() {
      const phone = document.getElementById('composer-phone').value || '';
      const name = document.getElementById('composer-name').value || 'Valued Patron';
      const msg = document.getElementById('composer-message').value || '';
      const orderId = document.getElementById('composer-order-select').value || null;

      if (!phone || !msg) {
        showToast('Recipient phone and message text are required', true);

          body: JSON.stringify({ phone, name, message: msg, order_id: orderId })

        showToast(`WhatsApp status: ${res.status}`);
        loadTabContent('whatsapp');
      } catch (err) {
        showToast(err.message, true);
      }

      const msg = document.getElementById('composer-message').value || '';
      if (!msg) return;

        showToast('Message text copied to clipboard!');
      }).catch(() => {
        showToast('Could not copy to clipboard', true);

    async function submitAdminCreateOrder(e) {
      e.preventDefault();
      const btn = document.getElementById('mo-submit-btn');
      btn.disabled = true;
      btn.innerText = 'Creating Order…';

      const name = document.getElementById('mo-name').value.trim();
      const rawPhone = document.getElementById('mo-phone').value.trim();
      const phone = rawPhone.replace(/\D/g, '').slice(-10);
      const email = document.getElementById('mo-email').value.trim();
      const address = document.getElementById('mo-address').value.trim();
      const city = document.getElementById('mo-city').value.trim();
      const stateVal = document.getElementById('mo-state').value;
      const pincode = document.getElementById('mo-pincode').value.trim();
      const prodId = document.getElementById('mo-product').value || 'custom_item';
      const itemName = document.getElementById('mo-item-name').value.trim() || 'Painite Bespoke Garment';
      const price = parseFloat(document.getElementById('mo-price').value || 1299);
      const qty = parseInt(document.getElementById('mo-qty').value || 1);
      const size = document.getElementById('mo-size').value;
      const color = document.getElementById('mo-color').value.trim() || 'Onyx Black';
      const payment = document.getElementById('mo-payment').value;
      const initialStatus = document.getElementById('mo-status').value;

      const orderPayload = {
        items: [{
          id: prodId,
          name: itemName,
          price: price,
          quantity: qty,
          color: color,
          size: size,
          style: 'Oversized'
        }],
        total: price * qty,
        customer_name: name,
        customer_phone: phone,
        customer_email: email || 'patron@painite.studio',
        address: `${address}, ${city}, ${stateVal} - ${pincode}`,
        city: city,
        state: stateVal,
        pincode: pincode,
        payment_method: payment,
        status: initialStatus,
        currency: 'INR'
      };

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderPayload)
        });
        const created = await res.json();
        if (!res.ok) throw new Error(created.detail || 'Failed to create order');

        if (initialStatus !== 'Pending') {
          await apiRequest(`/orders/${created.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: initialStatus })
          }).catch(() => {});
        }

        document.getElementById('admin-modal-backdrop').classList.remove('open');
        showToast(`Order #${created.id} created successfully!`);
        loadTabContent(state.currentTab);
      } catch (err) {
        alert('Error creating order: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Authorize & Register Order';
      }
    }

      const alertBox = document.getElementById('modal-price-alert');

        alertBox.innerText = 'Price Cap Violation: Jacket prices must never exceed ₹2,000.';

        saveBtn.disabled = true;

        alertBox.innerText = 'Price Cap Violation: T-shirt, shirt, and sweatshirt prices must never exceed ₹1,500.';
        alertBox.style.display = 'block';
        saveBtn.disabled = true;
      } else {

        saveBtn.disabled = false;
      }
    }

        }
        closeAdminModal();
        loadTabContent('categories');
      } catch (err) {
        showToast(err.message, true);
      }
    }

    // Coupon Modal
    function openCouponModal() {
      const html = `
        <form onsubmit="saveCouponForm(event)">
          <div class="form-group">
            <label class="form-label">Coupon Code *</label>
            <input type="text" id="mcpn-code" class="form-input" required placeholder="e.g. FESTIVE25" style="text-transform:uppercase;">
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="form-group">
              <label class="form-label">Discount Type *</label>
              <select id="mcpn-type" class="form-select">
                <option value="percentage">Percentage (% OFF)</option>
                <option value="fixed">Flat Amount (₹ OFF)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Discount Value *</label>
              <input type="number" id="mcpn-val" class="form-input" required min="1" placeholder="e.g. 15">
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="form-group">
              <label class="form-label">Minimum Cart Value (INR)</label>
              <input type="number" id="mcpn-min" class="form-input" value="1499" min="0">
            </div>
            <div class="form-group">
              <label class="form-label">Expiry Date</label>
              <input type="date" id="mcpn-exp" class="form-input" value="2026-12-31">
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1.5rem;">
            <button type="button" class="btn-secondary" onclick="closeAdminModal()">Cancel</button>
            <button type="submit" class="btn-primary">Create Coupon</button>
          </div>
        </form>
      `;
      openAdminModal('+ Create Promotional Privilege Coupon', html);
    }

    async function saveCouponForm(e) {
      e.preventDefault();
      const payload = {
        code: document.getElementById('mcpn-code').value.trim(),
        discount_type: document.getElementById('mcpn-type').value,
        discount_value: parseFloat(document.getElementById('mcpn-val').value),
        min_order_amount: parseFloat(document.getElementById('mcpn-min').value || 0),
        expires_at: document.getElementById('mcpn-exp').value
      };
      try {
        await apiRequest('/coupons', { method: 'POST', body: JSON.stringify(payload) });
        showToast(`Privilege code '${payload.code}' is now live on checkout!`);
        closeAdminModal();
        loadTabContent('coupons');
      } catch (err) {
        showToast(err.message, true);
      }
    }

    // Banner Modal
    function openBannerModal() {
      const html = `
        <form onsubmit="saveBannerForm(event)">
          <div class="form-group">
            <label class="form-label">Headline Title *</label>
            <input type="text" id="mbnr-title" class="form-input" required placeholder="e.g. SUMMER '26 SOLIDS DROP">
          </div>
          <div class="form-group">
            <label class="form-label">Subtitle / Subtext</label>
            <input type="text" id="mbnr-sub" class="form-input" placeholder="e.g. Combed Indian cotton blanks starting at ₹899">
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="form-group">
              <label class="form-label">Badge Label</label>
              <input type="text" id="mbnr-badge" class="form-input" value="★ EXCLUSIVE DROP">
            </div>
            <div class="form-group">
              <label class="form-label">Display Position</label>
              <select id="mbnr-pos" class="form-select">
                <option value="hero">Homepage Hero Banner</option>
                <option value="top_bar">Top Announcement Bar</option>
              </select>
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1.5rem;">
            <button type="button" class="btn-secondary" onclick="closeAdminModal()">Cancel</button>
            <button type="submit" class="btn-primary">Publish Banner</button>
          </div>
        </form>
      `;
      openAdminModal('+ Add Website Promotional Banner', html);
    }

    async function saveBannerForm(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('mbnr-title').value.trim(),
        subtitle: document.getElementById('mbnr-sub').value.trim(),
        badge_text: document.getElementById('mbnr-badge').value.trim(),
        position: document.getElementById('mbnr-pos').value
      };
      try {
        await apiRequest('/banners', { method: 'POST', body: JSON.stringify(payload) });
        showToast('Banner published to customer storefront!');
        closeAdminModal();
        loadTabContent('banners');
      } catch (err) {
        showToast(err.message, true);
      }
    }

    // Tracking Modal
    function openTrackingModal(orderId, currentAwb, currentDate) {
      const html = `
        <form onsubmit="saveTrackingForm(event, '${orderId}')">
          <div class="form-group">
            <label class="form-label">Courier Tracking AWB / Number *</label>
            <input type="text" id="mt-awb" class="form-input" value="${currentAwb}" required placeholder="e.g. BLUEDART-8931284">
          </div>
          <div class="form-group">
            <label class="form-label">Estimated Delivery Date</label>
            <input type="text" id="mt-date" class="form-input" value="${currentDate}" placeholder="e.g. 4 Nov 2026">
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1.5rem;">
            <button type="button" class="btn-secondary" onclick="closeAdminModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Tracking</button>
          </div>
        </form>
      `;
      openAdminModal(`Courier Tracking: Order ${orderId}`, html);
    }

    async function saveTrackingForm(e, orderId) {
      e.preventDefault();
      const payload = {
        tracking_number: document.getElementById('mt-awb').value.trim(),
        estimated_delivery_date: document.getElementById('mt-date').value.trim()
      };
      try {
        const res = await apiRequest(`/orders/${orderId}/tracking`, { method: 'PATCH', body: JSON.stringify(payload) });
        showToast(`Tracking saved! WhatsApp alert sent to customer.`);
        if (res.wa_link) {
          window.open(res.wa_link, '_blank');
        }
        closeAdminModal();
        loadTabContent('orders');
      } catch (err) {
        showToast(err.message, true);
      }
    }

    // Kickstart
    window.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
